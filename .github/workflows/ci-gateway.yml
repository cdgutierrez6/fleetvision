name: CI - Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/gateway/**'
      - '.github/workflows/ci-gateway.yml'
      - '.github/workflows/_ci-dotnet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/gateway/**'
      - '.github/workflows/ci-gateway.yml'
      - '.github/workflows/_ci-dotnet.yml'

permissions:
  contents: read   # least privilege for the reusable build-and-test job
  packages: write  # required: reusable docker job pushes the image to GHCR

jobs:
  ci:
    uses: ./.github/workflows/_ci-dotnet.yml
    with:
      service-name: gateway
      service-path: gateway
      api-project: services/gateway/src/FleetVision.Gateway/FleetVision.Gateway.csproj
      has-tests: true
      test-paths: services/gateway/tests/FleetVision.Gateway.Tests
