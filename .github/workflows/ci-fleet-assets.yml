name: CI - Fleet Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/fleet-assets/**'
      - '.github/workflows/ci-fleet-assets.yml'
      - '.github/workflows/_ci-dotnet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/fleet-assets/**'
      - '.github/workflows/ci-fleet-assets.yml'
      - '.github/workflows/_ci-dotnet.yml'

permissions:
  contents: read   # least privilege for the reusable build-and-test job
  packages: write  # required: reusable docker job pushes the image to GHCR

jobs:
  ci:
    uses: ./.github/workflows/_ci-dotnet.yml
    with:
      service-name: fleet-assets
      service-path: fleet-assets
      api-project: services/fleet-assets/src/FleetVision.FleetAssets.API/FleetVision.FleetAssets.API.csproj
      has-tests: true
      test-paths: >-
        services/fleet-assets/tests/FleetVision.FleetAssets.Application.Tests
        services/fleet-assets/tests/FleetVision.FleetAssets.Domain.Tests
