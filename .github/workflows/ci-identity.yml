name: CI - Identity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/identity/**'
      - '.github/workflows/ci-identity.yml'
      - '.github/workflows/_ci-dotnet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/identity/**'
      - '.github/workflows/ci-identity.yml'
      - '.github/workflows/_ci-dotnet.yml'

permissions:
  contents: read   # least privilege for the reusable build-and-test job
  packages: write  # required: reusable docker job pushes the image to GHCR

jobs:
  ci:
    uses: ./.github/workflows/_ci-dotnet.yml
    with:
      service-name: identity
      service-path: identity
      api-project: services/identity/src/FleetVision.Identity.API/FleetVision.Identity.API.csproj
      has-tests: true
      test-paths: >-
        services/identity/tests/FleetVision.Identity.Application.Tests
        services/identity/tests/FleetVision.Identity.Domain.Tests
