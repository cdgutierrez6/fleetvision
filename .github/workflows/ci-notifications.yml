name: CI — Notifications

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/notifications/**'
      - 'proto/**'
      - '.github/workflows/ci-notifications.yml'
      - '.github/workflows/_ci-dotnet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/notifications/**'
      - 'proto/**'
      - '.github/workflows/ci-notifications.yml'
      - '.github/workflows/_ci-dotnet.yml'

permissions:
  contents: read   # least privilege for the reusable build-and-test job
  packages: write  # required: reusable docker job pushes the image to GHCR

jobs:
  ci:
    uses: ./.github/workflows/_ci-dotnet.yml
    with:
      service-name: notifications
      service-path: notifications
      api-project: services/notifications/src/FleetVision.Notifications.API/FleetVision.Notifications.API.csproj
      has-tests: true
      test-paths: services/notifications/tests/FleetVision.Notifications.Tests
      # notifications is a SignalR push service (API + Infrastructure only): no Domain/
      # Application layer to unit-cover, so the >=70% gate would fail at 0.0% by
      # construction. Its ViolationHub / consumer tests still run.
      unit-coverage-gate: false
